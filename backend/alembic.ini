# =============================================================================
# Alembic Configuration
# =============================================================================
# WHY Alembic: mỗi thay đổi DB schema = 1 migration file có version.
# Rollback = alembic downgrade -1. Không bao giờ sửa DB bằng tay.
# sqlalchemy.url sẽ bị override bởi env.py (đọc từ environment variable)
# =============================================================================

[alembic]
script_location = alembic
sqlalchemy.url = postgresql://ngonngon:ngonngon@localhost:5432/ngonngon

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
