# =============================================================================
# Ngon-Ngon Nginx — Production cho ngon-ngon.com
# =============================================================================
# GIAI ĐOẠN 1: HTTP only (để lấy SSL cert)
# GIAI ĐOẠN 2: Chạy init-ssl.sh → tự động bật HTTPS
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip — quan trọng cho mobile 4G chậm
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=order:10m rate=5r/s;
    limit_req_status 429;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://ngon-ngon.com wss://www.ngon-ngon.com; font-src 'self'" always;

    server_tokens off;

    upstream api_backend {
        server api:8000;
        keepalive 16;
    }

    # --- HTTP Server (Giai đoạn 1 + Certbot challenge) ---
    server {
        listen 80;
        server_name ngon-ngon.com www.ngon-ngon.com;

        client_max_body_size 5M;

        # Certbot ACME challenge (BẮT BUỘC giữ lại cho SSL renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Nếu có SSL cert → redirect sang HTTPS
        # Nếu chưa có → serve bình thường qua HTTP
        set $redirect_to_https 0;
        if (-f /etc/letsencrypt/live/ngon-ngon.com/fullchain.pem) {
            set $redirect_to_https 1;
        }
        if ($redirect_to_https = 1) {
            return 301 https://$host$request_uri;
        }

        # === Các location block (dùng chung cho cả HTTP và HTTPS) ===

        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /api/v1/ws/ {
            access_log off;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /api/v1/orders {
            limit_req zone=order burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|wav|mp3)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
            location = /sw.js {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }
            location = /manifest.json { expires 1h; }
        }

        location ~ /\. { deny all; access_log off; log_not_found off; }
    }

    # --- HTTPS Server (tự động bật khi có SSL cert) ---
    server {
        listen 443 ssl http2;
        server_name ngon-ngon.com www.ngon-ngon.com;

        # SSL cert — nếu chưa có, nginx sẽ không listen 443
        # (file ssl-check ở Dockerfile xử lý điều này)
        ssl_certificate /etc/letsencrypt/live/ngon-ngon.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ngon-ngon.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 5M;

        location /health { access_log off; return 200 'OK'; add_header Content-Type text/plain; }

        location /api/v1/ws/ {
            access_log off;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /api/v1/orders {
            limit_req zone=order burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|wav|mp3)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
            location = /sw.js { expires -1; add_header Cache-Control "no-store, no-cache, must-revalidate"; }
            location = /manifest.json { expires 1h; }
        }

        location ~ /\. { deny all; access_log off; log_not_found off; }
    }
}
